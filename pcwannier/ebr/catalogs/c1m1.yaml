name: Wallpaper group c1m1
space_group_name: c1m1

k_points:
  - name: Gamma
    k: [0.0, 0.0]
  - name: X
    k: [0.5, 0.0]
  - name: Y
    k: [0.0, 0.5]
  - name: S
    k: [0.5, 0.5]

# EBR generators induced from the maximal Wyckoff positions of c1m1.
ebrs:
  - {name: A_prime@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: A_prime}
  - {name: A_double_prime@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: A_double_prime}
