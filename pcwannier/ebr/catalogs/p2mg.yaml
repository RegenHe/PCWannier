name: Wallpaper group p2mg
space_group_name: p2mg

k_points:
  - name: Gamma
    k: [0.0, 0.0]
  - name: X
    k: [0.5, 0.0]
  - name: Y
    k: [0.0, 0.5]
  - name: S
    k: [0.5, 0.5]

# EBR generators induced from the maximal Wyckoff positions of p2mg.
ebrs:
  - {name: A@2a, wyckoff: 2a, center: [0.0, 0.0], site_irrep: A}
  - {name: B@2a, wyckoff: 2a, center: [0.0, 0.0], site_irrep: B}

  - {name: A@2b, wyckoff: 2b, center: [0.5, 0.0], site_irrep: A}
  - {name: B@2b, wyckoff: 2b, center: [0.5, 0.0], site_irrep: B}

  - {name: A_prime@2c, wyckoff: 2c, center: [0.0, 0.25], site_irrep: A_prime}
  - {name: A_double_prime@2c, wyckoff: 2c, center: [0.0, 0.25], site_irrep: A_double_prime}
