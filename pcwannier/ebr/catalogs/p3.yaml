name: Wallpaper group p3
space_group_name: p3

k_points:
  - name: Gamma
    k: [0.0, 0.0]
  - name: K
    k: [1/3, 1/3]
  - name: K_prime
    k: [-1/3, -1/3]
  - name: M
    k: [0.5, 0.0]

# EBR generators induced from the maximal Wyckoff positions of p3.
ebrs:
  - {name: A@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: A}
  - {name: E_plus@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: E_plus}
  - {name: E_minus@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: E_minus}

  - {name: A@1b, wyckoff: 1b, center: [1/3, 2/3], site_irrep: A}
  - {name: E_plus@1b, wyckoff: 1b, center: [1/3, 2/3], site_irrep: E_plus}
  - {name: E_minus@1b, wyckoff: 1b, center: [1/3, 2/3], site_irrep: E_minus}

  - {name: A@1c, wyckoff: 1c, center: [2/3, 1/3], site_irrep: A}
  - {name: E_plus@1c, wyckoff: 1c, center: [2/3, 1/3], site_irrep: E_plus}
  - {name: E_minus@1c, wyckoff: 1c, center: [2/3, 1/3], site_irrep: E_minus}
