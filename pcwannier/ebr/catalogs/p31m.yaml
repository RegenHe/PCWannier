name: Wallpaper group p31m
space_group_name: p31m

k_points:
  - name: Gamma
    k: [0.0, 0.0]
  - name: K
    k: [1/3, 1/3]
  - name: K_prime
    k: [-1/3, -1/3]
  - name: M
    k: [0.5, 0.0]

# EBR generators induced from the maximal Wyckoff positions of p31m.
ebrs:
  - {name: A1@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: A1}
  - {name: A2@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: A2}
  - {name: E@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: E}

  - {name: A@2b, wyckoff: 2b, center: [1/3, 2/3], site_irrep: A}
  - {name: E_plus@2b, wyckoff: 2b, center: [1/3, 2/3], site_irrep: E_plus}
  - {name: E_minus@2b, wyckoff: 2b, center: [1/3, 2/3], site_irrep: E_minus}
