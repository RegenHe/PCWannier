name: Wallpaper group p3m1
space_group_name: p3m1

k_points:
  - name: Gamma
    k: [0.0, 0.0]
  - name: K
    k: [1/3, 1/3]
  - name: M
    k: [0.5, 0.0]

# EBR generators induced from the maximal Wyckoff positions of p3m1.
ebrs:
  - {name: A1@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: A1}
  - {name: A2@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: A2}
  - {name: E@1a, wyckoff: 1a, center: [0.0, 0.0], site_irrep: E}

  - {name: A1@1b, wyckoff: 1b, center: [1/3, 2/3], site_irrep: A1}
  - {name: A2@1b, wyckoff: 1b, center: [1/3, 2/3], site_irrep: A2}
  - {name: E@1b, wyckoff: 1b, center: [1/3, 2/3], site_irrep: E}

  - {name: A1@1c, wyckoff: 1c, center: [2/3, 1/3], site_irrep: A1}
  - {name: A2@1c, wyckoff: 1c, center: [2/3, 1/3], site_irrep: A2}
  - {name: E@1c, wyckoff: 1c, center: [2/3, 1/3], site_irrep: E}
