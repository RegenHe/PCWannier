name: Wallpaper group p4gm
space_group_name: p4gm

k_points:
  - name: Gamma
    k: [0.0, 0.0]
  - name: X
    k: [0.5, 0.0]
  - name: M
    k: [0.5, 0.5]

# EBR generators induced from the maximal Wyckoff positions of p4gm.
ebrs:
  - {name: A@2a, wyckoff: 2a, center: [0.0, 0.0], site_irrep: A}
  - {name: B@2a, wyckoff: 2a, center: [0.0, 0.0], site_irrep: B}
  - {name: E_plus@2a, wyckoff: 2a, center: [0.0, 0.0], site_irrep: E_plus}
  - {name: E_minus@2a, wyckoff: 2a, center: [0.0, 0.0], site_irrep: E_minus}

  - {name: A1@2b, wyckoff: 2b, center: [0.5, 0.0], site_irrep: A1}
  - {name: A2@2b, wyckoff: 2b, center: [0.5, 0.0], site_irrep: A2}
  - {name: B1@2b, wyckoff: 2b, center: [0.5, 0.0], site_irrep: B1}
  - {name: B2@2b, wyckoff: 2b, center: [0.5, 0.0], site_irrep: B2}
