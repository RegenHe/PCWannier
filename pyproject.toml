[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pcwannier"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.12",
  "matplotlib>=3.10",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.15",
  "spglib>=2.7,<3",
  "spgrep>=0.6,<0.7",
  "threadpoolctl>=3.6",
]

[project.optional-dependencies]
numba = [
  "numba>=0.61",
]

[project.scripts]
pcwannier = "pcwannier.cli:main"

[tool.setuptools.packages.find]
include = ["pcwannier*"]

[tool.setuptools.dynamic]
version = {attr = "pcwannier._version.__version__"}

[tool.setuptools.package-data]
"pcwannier.symmetry" = ["space_groups/*.yaml", "finite_groups/*.yaml"]
"pcwannier.ebr" = ["catalogs/*.yaml", "catalogs/*/*.yaml"]
